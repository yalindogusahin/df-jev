[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "df-jev"
version = "0.1.0"
description = "Inspect pandas dataframes with natural-language judgments from Jev-compatible endpoints."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<3", "httpx>=0.28,<1"]

[project.optional-dependencies]
app = ["streamlit>=1.45,<2", "pyarrow>=18"]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/df_jev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
