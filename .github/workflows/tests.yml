name: Tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Build and verify package
        run: |
          uv build
          uv venv --python 3.12 /tmp/pkg-verify
          uv pip install --python /tmp/pkg-verify/bin/python dist/*.whl
          /tmp/pkg-verify/bin/python -c "import jevpandas; print(jevpandas.__version__)"
